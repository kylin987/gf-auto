name: Build yhs-fish-plugin

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bundle Node for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_bin | Out-Null
          Copy-Item (Get-Command node).Source node_bin\node.exe

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller oss2

      - name: Prepare version metadata
        shell: pwsh
        run: |
          $tag = ''
          if ('${{ github.ref }}' -like 'refs/tags/*') {
            $tag = '${{ github.ref_name }}'
          }
          python scripts/windows/prepare_release.py --tag $tag

      - name: Build Windows client
        run: python -m PyInstaller --clean --noconfirm --distpath release/client --workpath build xianyu.spec

      - name: Create Windows release files
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          Compress-Archive -Path release\client\XianYuApis -DestinationPath "release\yhs-fish-plugin-client-win64-v$version.zip" -Force
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          .\scripts\windows\build_client_installer.ps1 -ClientDir release\client\XianYuApis -ReleaseVersion $version

      - name: Upload release to OSS
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID || secrets.ALIOSS_ACCESS_KEY }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET || secrets.ALIOSS_ACCESS_SECRET || secrets.ALIOSS_SECRET_KEY }}
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          OSS_BUCKET: yinghuasuan
          OSS_PREFIX: assets/releases/gf-auto
          OSS_PUBLIC_BASE_URL: https://img.yinghuasuan.com/assets/releases/gf-auto
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OSS_ACCESS_KEY_ID) -or [string]::IsNullOrWhiteSpace($env:OSS_ACCESS_KEY_SECRET)) {
            throw "OSS access key secrets are not configured"
          }
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          python scripts\windows\upload_client_release_to_oss.py `
            --zip "release\yhs-fish-plugin-client-win64-v$version.zip" `
            --installer "release\yhs-fish-plugin-setup-v$version.exe" `
            --version "${{ github.ref_name }}" `
            --endpoint $env:OSS_ENDPOINT `
            --bucket $env:OSS_BUCKET `
            --access-key-id $env:OSS_ACCESS_KEY_ID `
            --access-key-secret $env:OSS_ACCESS_KEY_SECRET `
            --prefix $env:OSS_PREFIX `
            --public-base-url $env:OSS_PUBLIC_BASE_URL

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/yhs-fish-plugin-client-win64-v*.zip
            release/yhs-fish-plugin-setup-v*.exe
          generate_release_notes: true
