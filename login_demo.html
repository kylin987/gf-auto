<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闲鱼 AI 客服助手 - 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: oklch(0.92 0.15 95);
      --yellow-strong: oklch(0.86 0.16 95);
      --yellow-dark: oklch(0.78 0.14 95);
      --yellow-soft: oklch(0.97 0.05 94);
      --ink: oklch(0.24 0.03 80);
      --muted: oklch(0.5 0.02 80);
      --line: oklch(0.9 0.015 92);
      --bg: oklch(0.965 0.02 94);
      --surface: oklch(0.995 0.008 95);
      --green: oklch(0.52 0.13 155);
      --green-soft: oklch(0.93 0.05 155);
      --danger: oklch(0.55 0.18 27);
      --titlebar: oklch(0.22 0.025 80);
      --titlebar-text: oklch(0.95 0.02 90);
      --radius: 8px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 16px;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    :focus-visible {
      outline: 3px solid oklch(0.84 0.16 95 / 0.55);
      outline-offset: 2px;
    }

    .window {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .titlebar {
      height: 46px;
      flex: 0 0 46px;
      background: var(--titlebar);
      color: var(--titlebar-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      user-select: none;
    }

    .titlebar-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .app-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--yellow);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 36px 32px;
      box-shadow: 0 16px 40px oklch(0.24 0.03 80 / 0.06);
    }

    .section-kicker {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .login-subtitle {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: oklch(0.985 0.006 95);
      color: var(--ink);
      font-size: 0.95rem;
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }

    .input-wrap input::placeholder {
      color: oklch(0.62 0.02 85);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 3px oklch(0.92 0.15 95 / 0.35);
    }

    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 140ms var(--ease), background 140ms var(--ease);
    }

    .password-toggle:hover {
      color: var(--ink);
      background: var(--yellow-soft);
    }

    .error-box {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: oklch(0.95 0.04 27 / 0.18);
      color: var(--danger);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .error-box.show {
      display: flex;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: var(--radius);
      background: var(--yellow);
      color: var(--ink);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--yellow-dark);
      transition: background 160ms var(--ease), transform 160ms var(--ease);
    }

    .login-btn:hover {
      background: var(--yellow-strong);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .login-btn.loading {
      background: oklch(0.88 0.04 95);
      box-shadow: inset 0 0 0 1px oklch(0.82 0.06 95);
      cursor: wait;
    }

    .login-btn.success {
      background: var(--green);
      color: #fff;
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .login-hint {
      margin: 20px 0 0;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .login-hint code {
      color: var(--ink);
      font-family: "DM Sans", monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <span class="titlebar-brand">
        <span class="app-icon">影</span>
        闲鱼 AI 客服助手
      </span>
    </header>

    <main class="main">
      <section class="login-card" aria-label="账号登录">
        <p class="section-kicker">账号登录</p>
        <h1>登录闲鱼客服助手</h1> 
        <p class="login-subtitle">需使用影划算后台-系统-子账号管理，创建的子账号进行登录</p>

        <div class="error-box" id="errorBox" role="alert" aria-live="polite"></div>

        <div class="field">
          <label for="username">账号</label>
          <div class="input-wrap">
            <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
          </div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            <button class="password-toggle" id="togglePwd" type="button" aria-label="显示或隐藏密码">显示</button>
          </div>
        </div>

        <button class="login-btn" id="loginBtn" type="button">登录</button>

      </section>
    </main>
  </div>

  <script>
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("errorBox");
    const togglePwd = document.getElementById("togglePwd");

    togglePwd.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      togglePwd.textContent = showing ? "显示" : "隐藏";
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.remove("show");
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.classList.toggle("loading", loading);
      loginBtn.textContent = loading ? "正在登录..." : "登录";
    }

    loginBtn.addEventListener("click", doLogin);
    [usernameInput, passwordInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") doLogin();
      });
    });

    function doLogin() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username && !password) {
        showError("请输入账号和密码");
        usernameInput.focus();
        return;
      }
      if (!username) {
        showError("请输入账号");
        usernameInput.focus();
        return;
      }
      if (!password) {
        showError("请输入密码");
        passwordInput.focus();
        return;
      }

      clearError();
      setLoading(true);

      setTimeout(() => {
        if (username === "demo" && password === "123456") {
          loginBtn.classList.remove("loading");
          loginBtn.classList.add("success");
          loginBtn.textContent = "登录成功，正在进入客户端...";
          showError("");
          errorBox.classList.remove("show");
        } else {
          setLoading(false);
          showError("账号或密码不正确，请重试");
        }
      }, 800);
    }
  </script>
</body>
</html>
